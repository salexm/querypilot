services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      ANALYTICS_DB_NAME: ${ANALYTICS_DB_NAME:?set ANALYTICS_DB_NAME in .env}
      ANALYTICS_READONLY_USER: ${ANALYTICS_READONLY_USER:?set ANALYTICS_READONLY_USER in .env}
      ANALYTICS_READONLY_PASSWORD: ${ANALYTICS_READONLY_PASSWORD:?set ANALYTICS_READONLY_PASSWORD in .env}
      APP_DB_NAME: ${APP_DB_NAME:?set APP_DB_NAME in .env}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      QUERY_TIMEOUT_MS: ${QUERY_TIMEOUT_MS:?set QUERY_TIMEOUT_MS in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP on purpose: the temporary server that runs db/init listens only on
      # the Unix socket, so this stays unhealthy until init has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$ANALYTICS_DB_NAME\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  seed:
    build: ./db/seed
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ANALYTICS_DB_NAME: ${ANALYTICS_DB_NAME:?set ANALYTICS_DB_NAME in .env}
      SEED_FORCE: ${SEED_FORCE:-}
    volumes:
      - ./db/seed/data:/app/data

  api:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      # Only the read-only role, so generated SQL can't use any other credentials.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ANALYTICS_DB_NAME: ${ANALYTICS_DB_NAME:?set ANALYTICS_DB_NAME in .env}
      ANALYTICS_READONLY_USER: ${ANALYTICS_READONLY_USER:?set ANALYTICS_READONLY_USER in .env}
      ANALYTICS_READONLY_PASSWORD: ${ANALYTICS_READONLY_PASSWORD:?set ANALYTICS_READONLY_PASSWORD in .env}
      QUERY_TIMEOUT_MS: ${QUERY_TIMEOUT_MS:?set QUERY_TIMEOUT_MS in .env}
      QUERY_MAX_ROWS: ${QUERY_MAX_ROWS:?set QUERY_MAX_ROWS in .env}
      LLM_PROVIDER: ${LLM_PROVIDER:?set LLM_PROVIDER in .env}
      LLM_MODEL: ${LLM_MODEL:?set LLM_MODEL in .env}
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      LLM_EFFORT: ${LLM_EFFORT:-medium}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r; r.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL in .env}
      WATCH_POLLING: "true"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
