name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python lint and seed tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            db/seed/requirements*.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt -r db/seed/requirements-dev.txt

      - name: Check lint rules
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run seed tests
        working-directory: db/seed
        run: python -m pytest

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The dataset's pinned hashes live in seed.py, so this reuses the download
      # until they change.
      - name: Restore dataset
        uses: actions/cache@v6
        with:
          path: db/seed/data
          key: olist-${{ hashFiles('db/seed/seed.py') }}

      - name: Create environment file
        run: cp .env.example .env

      - name: Start the database
        run: docker compose up -d --wait db

      - name: Load the dataset
        run: docker compose run --rm --build seed

      - name: Start the API
        run: docker compose up -d --build --wait api

      # REQUIRE_DATABASE makes integration tests fail rather than skip, so a
      # broken database can't produce a green run. No test calls a real LLM.
      - name: Run backend tests
        run: docker compose exec -T -e REQUIRE_DATABASE=1 api pytest

      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color --tail 100
